[package]
name = "alpha_nokamute_mit"
description = "Hive AI focused on speed"
version = "1.0.3"
authors = ["Eric Roshan-Eisner <eric.d.eisner@gmail.com>"]
edition = "2021"
repository = "http._//github.com/edre/nokamute"
readme = "README.md"
license = "MIT"

[profile.performance]
inherits = "release"
lto = "thin"
codegen-units = 1

[dependencies]
minimax = { path = "../minimax-rs" }
rand = "0.9"
sha2 = "0.10"
serde_json = "1"

[target.'cfg(not(target_arch="wasm32"))'.dependencies]
pico-args = "0.4"

[target.'cfg(target_arch="wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
easybench = "1.1.0"

[target.'cfg(target_arch="wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
# More efficient memory layout, but less correct in edge cases.
smaller-grid = []
# No-op for backwards compatibility.
larger-grid = []

# For wasm32 library builds.
[lib]
name = "nokamute_core"
crate-type=["cdylib", "rlib"]
