[project]
name = "genseki-hive"
version = "0.1.0"
description = "Rho research and UHP tooling for the Alpha Hive engine."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.12",
]

[project.scripts]
genseki-rho = "genseki.rho.campaign:main"
genseki-rho-status = "genseki.rho.status:main"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["genseki", "genseki.*"]
