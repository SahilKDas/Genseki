[project]
name = "genseki-hive"
version = "0.1.0"
description = "Experiment tooling for Genseki's Hive bot league."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.12",
]

[project.scripts]
genseki-experiments = "genseki.experiments:main"
genseki-report = "genseki.report:main"
genseki-train = "genseki.training:main"
genseki-gauntlet = "genseki.gauntlet:main"
genseki-export-nnue = "genseki.export_nnue:main"
genseki-nokamute-gate = "genseki.nokamute_gate:main"

[tool.ruff]
line-length = 100
